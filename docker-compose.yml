# Local dev services. Start with: pnpm services:up
# pgweb (http://localhost:8081) is a web UI for browsing the local database.
# storage is SeaweedFS, an S3-compatible stand-in for Backblaze B2 (see docs/decisions/0008).
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory, so the volume mounts one level
      # up. The volume is named after the major version: a new major can't start on old data, so
      # an upgrade gets a fresh volume (then pnpm db:migrate && pnpm db:seed).
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedback -d feedback']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://feedback:feedback@postgres:5432/feedback?sslmode=disable
    ports:
      # Localhost only: pgweb has no auth and full database access.
      - '127.0.0.1:8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8081/api/info']
      interval: 5s
      timeout: 5s
      retries: 10

  storage:
    image: chrislusf/seaweedfs:4.47
    # One process running the master, a volume server, the filer, and the S3 gateway.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    configs:
      - source: seaweedfs-s3
        target: /etc/seaweedfs/s3.json
    ports:
      # Localhost only. The browser uploads to and plays from 8333 directly via presigned URLs.
      - '127.0.0.1:8333:8333'
      # Filer UI for browsing stored files (under /buckets).
      - '127.0.0.1:8888:8888'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 20

configs:
  # S3 credentials for local dev only, like the Postgres password above (matches .env.example).
  seaweedfs-s3:
    content: |
      {
        "identities": [
          {
            "name": "feedback-dev",
            "credentials": [{ "accessKey": "feedback", "secretKey": "feedback-dev-secret" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          }
        ]
      }

volumes:
  postgres-18-data:
  redis-data:
  storage-data:
