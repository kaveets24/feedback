# Local dev services. Start with: pnpm services:up
# pgweb (http://localhost:8081) is a web UI for browsing the local database.
# Object storage (S3-compatible stand-in for R2) is added in Phase 2.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: feedback
      POSTGRES_PASSWORD: feedback
      POSTGRES_DB: feedback
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images keep data in a versioned subdirectory, so the volume mounts one level
      # up. The volume is named after the major version: a new major can't start on old data, so
      # an upgrade gets a fresh volume (then pnpm db:migrate && pnpm db:seed).
      - postgres-18-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U feedback -d feedback']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://feedback:feedback@postgres:5432/feedback?sslmode=disable
    ports:
      # Localhost only: pgweb has no auth and full database access.
      - '127.0.0.1:8081:8081'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8081/api/info']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-18-data:
  redis-data:
