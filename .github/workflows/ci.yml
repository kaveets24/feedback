name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
          POSTGRES_DB: feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedback -d feedback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://feedback:feedback@localhost:5432/feedback
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test

  # Builds the API/worker server image (see docs/decisions/0003), checks that it migrates a fresh
  # database and serves /v1/health, and on main pushes it to GHCR tagged with the commit SHA.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: feedback
          POSTGRES_PASSWORD: feedback
          POSTGRES_DB: feedback
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedback -d feedback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://feedback:feedback@localhost:5432/feedback
      IMAGE: ghcr.io/${{ github.repository_owner }}/feedback-server:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            NODE_VERSION=${{ steps.versions.outputs.node }}
            PNPM_VERSION=${{ steps.versions.outputs.pnpm }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm --network host -e DATABASE_URL "$IMAGE" node packages/db/src/scripts/migrate.ts
          docker run -d --name api --network host -e DATABASE_URL -e CLERK_SECRET_KEY=sk_test_ci "$IMAGE"
          docker run -d --name worker --network host "$IMAGE" node apps/worker/src/index.ts
          for i in $(seq 1 20); do curl -fsS localhost:4000/v1/health && break; sleep 1; done
          curl -fsS localhost:4000/v1/health
          test "$(docker inspect -f '{{.State.Running}}' worker)" = true
      - name: Container logs
        if: failure()
        run: docker logs api; docker logs worker
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"
